services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  bot:
    build: .
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      SESSION_PATH: /app/sessions
      REDIS_HOST: redis
    ports:
      - "3001:3001"
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./temp:/app/temp
    restart: unless-stopped

volumes:
  redis_data:
